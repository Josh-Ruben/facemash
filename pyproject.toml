[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "facemash-ruben"
version = "0.3.2"
description = "A cross-platform app that watches your webcam and nudges you when you touch your face — to build the habit of keeping your hands off and improve skin health."
readme = "README.md"
requires-python = ">=3.9,<3.13"
license = { text = "MIT" }
authors = [{ name = "Ruben" }]
keywords = ["face-touch", "habit", "mediapipe", "webcam", "skin", "windows", "macos", "cross-platform"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Utilities",
]
dependencies = [
"pystray",
"pyttsx3",

    "mediapipe>=0.10.30",
    "opencv-contrib-python>=4.9",
    "numpy>=1.24",
    "rumps>=0.4.0; sys_platform == 'darwin'",
]

[project.scripts]
facemash = "facemash.__main__:main"

[project.urls]
Homepage = "https://github.com/Josh-Ruben/facemash"

[tool.hatch.build.targets.wheel]
packages = ["facemash"]
